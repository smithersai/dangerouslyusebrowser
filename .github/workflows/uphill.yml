name: Uphill Lighthouse Audit

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: Lighthouse Backpressure Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run official Uphill action
        uses: wevm/uphill@main
      - name: Validate metric scripts and generate Lighthouse UI
        run: |
          npx --yes uphill@0.0.11 check
          npx --yes uphill@0.0.11 --compact --require-targets
          node scripts/build-audit-report.mjs
      - name: Publish Lighthouse summary
        if: always()
        run: |
          if [ -f .uphill/comment.md ]; then
            cat .uphill/comment.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f .uphill/report.md ]; then
            cat .uphill/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Lighthouse Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dub-lighthouse-audit
          path: |
            .uphill/report.json
            .uphill/report.md
            .uphill/report.html
            site/audit.html
            site/audit-summary.json
          retention-days: 30
